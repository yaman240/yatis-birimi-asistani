<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yatış Birimi Asistanı v10.2</title>
<link rel="stylesheet" href="./style.css?v=10.2">
<meta name="theme-color" content="#2563eb">
</head>
<body>
<div class="wrap">
  <header class="box header-box">
    <div>
      <h1>Yatış Birimi Asistanı</h1>
      <div class="muted">Ameliyat ve işlem fiyatlarını hızlıca bulur.</div>
      <div id="connectionStatus" class="status">Firebase bağlantısı kuruluyor...</div>
    </div>
    <button id="printButton" class="print-btn" type="button">🖨️ Görünen Listeyi Yazdır</button>
  </header>

  <section class="box no-print">
    <div class="filters">
      <input id="search" placeholder="Ameliyat veya işlem ara...">
      <select id="filter"></select>
    </div>
  </section>

  <section id="recordForm" class="box no-print">
    <h2>Kayıt Ekle / Düzenle</h2>
    <div class="grid">
      <div class="full">
        <label for="clinic">Branş</label>
        <select id="clinic"></select>
        <div class="field-help">Manuel yazım kapatıldı; böylece aynı branş farklı yazımla tekrar oluşmaz.</div>
      </div>
      <div class="full"><label for="name">Ameliyat / işlem adı</label><input id="name"></div>
      <div><label for="minPrice">Genel en düşük fiyat</label><input id="minPrice" type="number" min="0"></div>
      <div><label for="maxPrice">Genel en yüksek fiyat</label><input id="maxPrice" type="number" min="0"></div>
      <div><label for="sgkPrice">SGK'lı fiyat</label><input id="sgkPrice" type="number" min="0"></div>
      <div><label for="privatePrice">Özel / ücretli fiyat</label><input id="privatePrice" type="number" min="0"></div>
      <div class="full"><label for="description">Açıklama</label><textarea id="description" rows="4"></textarea></div>
      <div class="full check"><input id="cashOnly" type="checkbox"><label for="cashOnly">Sadece nakit ödeme</label></div>
    </div>
    <div class="actions">
      <button id="saveButton" class="primary" type="button">Kaydet</button>
      <button id="clearButton" class="secondary" type="button">Temizle</button>
    </div>
  </section>

  <main class="box list-box">
    <div id="printHeader" class="print-header"></div>
    <div id="list"><p class="muted">Kayıtlar yükleniyor...</p></div>
    <div id="printFooter" class="print-footer"></div>
  </main>

</div>
<script type="module" src="./app.js?v=10.2"></script>
</body>
</html>
