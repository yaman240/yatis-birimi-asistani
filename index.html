<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yatış Birimi Asistanı</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}
.wrap{max-width:1000px;margin:24px auto;padding:0 14px} .box{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #0001}
h1{margin:0 0 6px} .muted{color:#64748b} .filters{display:grid;grid-template-columns:2fr 1fr;gap:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .full{grid-column:1/-1} label{display:block;font-weight:700;margin:4px 0 6px}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer} .primary{background:#2563eb;color:white} .secondary{background:#e2e8f0} .danger{background:#dc2626;color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .group-title{background:#eff6ff;border-left:5px solid #2563eb;padding:10px 12px;border-radius:8px;margin:20px 0 10px}
.card{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px} .cash{border:3px solid #dc2626;background:#fff7f7}
.cashwarn{background:#dc2626;color:white;text-align:center;font-weight:900;padding:8px;border-radius:7px;margin-bottom:9px}
.name{font-size:19px;font-weight:800;margin-bottom:8px} .prices{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px} .chip{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;font-weight:800}
.note{white-space:pre-line;color:#475569} .check{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #fca5a5;border-radius:8px;background:#fff7f7} .check input{width:auto}
@media(max-width:700px){.filters,.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>

<body><div class="wrap">
<div class="box"><h1>Yatış Birimi Asistanı</h1><div class="muted">Hasta bilgisi içermez. Ameliyat ve işlem fiyatlarını hızlıca bulur.</div></div>
<div class="box">
<div class="filters"><input id="search" placeholder="Ameliyat veya işlem ara..." oninput="render()"><select id="filter" onchange="render()"></select></div>
<div id="list"></div>
</div>
<div class="box">
<h2>Kayıt Ekle / Düzenle</h2>
<div class="grid">
<div class="full"><label>Poliklinik</label><input id="clinic" placeholder="Örn: Ortopedi"></div>
<div class="full"><label>Ameliyat / işlem adı</label><input id="name"></div>
<div><label>Genel en düşük fiyat</label><input id="minPrice" type="number"></div>
<div><label>Genel en yüksek fiyat</label><input id="maxPrice" type="number"></div>
<div><label>SGK'lı fiyat</label><input id="sgkPrice" type="number"></div>
<div><label>Özel / ücretli fiyat</label><input id="privatePrice" type="number"></div>
<div class="full"><label>Açıklama</label><textarea id="description"></textarea></div>
<div class="full check"><input id="cashOnly" type="checkbox"><label for="cashOnly">Sadece nakit ödeme</label></div>
</div>
<div class="actions"><button class="primary" onclick="save()">Kaydet</button><button class="secondary" onclick="clearForm()">Temizle</button></div>
</div>
</div>

function persist(){localStorage.setItem("surgeryPrices",JSON.stringify(data))}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function money(n){return new Intl.NumberFormat("tr-TR").format(n)+" TL"}
function prices(x){
 let a=[];
 if(x.sgkPrice!=null)a.push(`<span class="chip">SGK: ${money(x.sgkPrice)}</span>`);
 if(x.privatePrice!=null)a.push(`<span class="chip">Özel: ${money(x.privatePrice)}</span>`);
 if(!a.length&&x.minPrice!=null)a.push(`<span class="chip">${x.maxPrice&&x.maxPrice!==x.minPrice?money(x.minPrice)+" - "+money(x.maxPrice):money(x.minPrice)}</span>`);
 if(!a.length)a.push(`<span class="chip">Fiyat girilmedi</span>`);
 return a.join("");
}
function updateFilter(){
 const f=document.getElementById("filter"),v=f.value;
 const cs=[...new Set(data.map(x=>x.clinic))].sort((a,b)=>a.localeCompare(b,"tr"));
 f.innerHTML='<option value="">Tüm poliklinikler</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join("");
 if(cs.includes(v))f.value=v;
}
function render(){
 updateFilter();
 const q=document.getElementById("search").value.toLocaleLowerCase("tr-TR"),f=document.getElementById("filter").value;
 const rows=data.filter(x=>(!f||x.clinic===f)&&((x.name+" "+x.clinic+" "+(x.description||"")).toLocaleLowerCase("tr-TR").includes(q)));
 const groups={};rows.forEach(x=>(groups[x.clinic]??=[]).push(x));

}
function val(id){return document.getElementById(id).value.trim()}
function num(id){const v=val(id);return v?Number(v):null}
function save(){
 const clinic=val("clinic"),name=val("name");if(!clinic||!name){alert("Poliklinik ve işlem adı zorunludur.");return}
 const item={id:editing||Date.now(),clinic,name,minPrice:num("minPrice"),maxPrice:num("maxPrice"),sgkPrice:num("sgkPrice"),privatePrice:num("privatePrice"),description:val("description"),cashOnly:document.getElementById("cashOnly").checked};

}
function edit(id){const x=data.find(y=>y.id===id);editing=id;["clinic","name","description"].forEach(k=>document.getElementById(k).value=x[k]||"");["minPrice","maxPrice","sgkPrice","privatePrice"].forEach(k=>document.getElementById(k).value=x[k]??"");document.getElementById("cashOnly").checked=!!x.cashOnly;scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
